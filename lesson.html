<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson · learn-circuits</title>
</head>
<body>
  <header class="top">
    <a class="quit" href="./" title="Leave the lesson" aria-label="Leave the lesson">✕</a>
    <div id="progress" class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </header>

  <main id="main">
    <div id="column" class="column">
      <section id="prompt" class="prompt"></section>
      <section id="circuitCard" class="circuit-card" aria-label="Circuit">
        <!-- The simulator, display only: the lesson changes the circuit through its own controls. -->
        <iframe id="circuitFrame" title="Circuit simulation" tabindex="-1"></iframe>
        <div id="readouts" class="readouts"><span class="loading">Starting the simulator…</span></div>
      </section>
      <section id="answer" class="answer"></section>
    </div>
  </main>

  <footer id="footer" class="footer">
    <div class="footer-inner">
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <button id="primary" class="button primary" type="button" disabled>Continue</button>
    </div>
  </footer>

  <script type="module" src="/src/lesson/main.ts"></script>
</body>
</html>

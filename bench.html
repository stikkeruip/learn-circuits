<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Bench · Ohmwork</title>
</head>
<body class="no-table">
  <header class="bench-bar">
    <a class="brand" href="./" title="Back to the job path">
      <svg class="logo-resistor" viewBox="0 0 92 20" aria-hidden="true">
        <path class="lead" d="M0 10 H18 M74 10 H92" />
        <rect class="body" x="18" y="2" width="56" height="16" rx="8" />
        <rect x="28" y="3" width="5" height="14" fill="#7A4A2A" />
        <rect x="37" y="3" width="5" height="14" fill="#F26B1D" />
        <rect x="46" y="3" width="5" height="14" fill="#D63A2A" />
        <rect x="60" y="3" width="5" height="14" fill="#C9A227" />
      </svg>
      <h1 class="heading">The Bench</h1>
    </a>
    <span id="fromLesson" class="file-tag mono" hidden></span>
    <div class="bar-keys">
      <a class="button secondary small" href="./">Job path</a>
      <label class="button secondary small toggle"><input id="showTable" type="checkbox"> Parts table</label>
      <a class="button secondary small" href="sim.html">Simulator only</a>
    </div>
  </header>
  <p id="fromNote" class="from-note" hidden></p>

  <main class="floor">
    <!-- The bench monitor: CircuitJS1's own editor, in the shop's look (src/sim/skin.css). -->
    <section class="monitor" aria-labelledby="monitorTitle">
      <div class="monitor-head">
        <h2 id="monitorTitle" class="mono">Ohmwork bench monitor · Model 84</h2>
        <p class="bench-hint">Pick a part from the toolbar or the Draw menu, then drag on the screen to place it. Right-click a part to edit or delete it.</p>
      </div>
      <iframe id="sim" title="Circuit simulator"></iframe>
    </section>

    <section id="tablePanel" class="panel parts" aria-label="Parts table"><table id="elements"></table></section>
  </main>

  <script type="module" src="/src/bench/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>learn-circuits</title>
</head>
<body>
  <header class="bar">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">⚡</span>learn-circuits</a>
    <a class="bar-link" href="bench.html">Bench</a>
  </header>

  <main class="home">
    <section class="panel course" aria-labelledby="lessonsTitle">
      <div class="panel-head">
        <h2 id="lessonsTitle">Lessons</h2>
        <span id="courseCount" class="count"></span>
      </div>
      <div id="courseBar" class="course-bar" role="progressbar" aria-label="Lessons done" aria-valuemin="0" aria-valuenow="0">
        <div id="courseFill" class="course-fill"></div>
      </div>
      <p id="courseNote" class="course-note" hidden></p>
      <ol id="path" class="path"></ol>
    </section>

    <section class="panel bench" aria-labelledby="benchTitle">
      <!-- A battery and a resistor, with current flowing round: what the Bench draws. -->
      <svg class="bench-art" viewBox="0 0 260 140" aria-hidden="true">
        <path class="wire" d="M50 62 V24 H210 V40 M210 100 V116 H50 V76" />
        <path class="current" d="M50 62 V24 H210 V116 H50 V76" />
        <path class="part" d="M34 62 H66 M42 76 H58" />
        <path class="part" d="M210 40 L222 45 L198 55 L222 65 L198 75 L222 85 L198 95 L210 100" />
        <text x="74" y="74">12 V</text>
        <text x="232" y="74">6 Ω</text>
      </svg>
      <h2 id="benchTitle">Bench</h2>
      <p>The full circuit simulator. Build any circuit you like, change any part, and watch the current flow.</p>
      <a class="button secondary" href="bench.html">Open the Bench</a>
      <h3>Start from a lesson's circuit</h3>
      <ul id="lessonCircuits" class="circuits"></ul>
    </section>
  </main>

  <script type="module" src="/src/home/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Circuit simulator</title>
  <!-- CircuitJS1's own stylesheet and icon font, unmodified. -->
  <link rel="stylesheet" href="/circuitjs1/ts/style.css">
  <link rel="stylesheet" href="/circuitjs/font/fontello.css">
  <!-- Our shop look over its controls, after its own stylesheet. -->
  <link rel="stylesheet" href="/src/sim/skin.css">
  <!-- CircuitJS1 sets no page background and assumes the browser's white one; ours is the bench panel. -->
  <style>
    html { background: #FBF6EA; }
    /* The simulator is a drawing and controls, not text: a drag or Ctrl+A
       must not paint it with the browser's selection blue. Fields you type
       in keep normal selection. */
    body { -webkit-user-select: none; user-select: none; }
    input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <script type="module" src="/src/sim/main.ts"></script>
</body>
</html>
